name: Release (Electron Installer)

on:
  push:
    tags:
      - 'release_*'
      - 'v*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to release (e.g. 0.2.1)'
        required: true
        default: '0.2.1'

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20.x'

      - name: Extract version
        id: ver
        shell: pwsh
        run: |
          if ('${{ github.event_name }}' -eq 'workflow_dispatch') {
            $raw = '${{ github.event.inputs.version }}'
            $version = $raw -replace '^(?:release_|v)', ''
          } else {
            $tag = "${{ github.ref_name }}"
            if ($tag -match '^(?:release_|v)?(\d+\.\d+\.\d+)$') {
              $version = $Matches[1]
            } else {
              Write-Error "Tag '$tag' does not match release_X.Y.Z or vX.Y.Z"
              exit 1
            }
          }
          "version=$version" >> $env:GITHUB_OUTPUT
          Write-Host "Version: $version"

      - name: Install Electron dependencies
        run: |
          cd electron
          npm install --no-audit --no-fund

      - name: Set Electron app version
        shell: pwsh
        run: |
          $v = "${{ steps.ver.outputs.version }}"
          Push-Location electron
          npm version $v --no-git-tag-version --allow-same-version
          Pop-Location

      - name: Build and publish all release assets
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          cd electron
          npm run dist:publish
